<h1 class="text-main display-4 mb-0"><span class="text-blue">P</span>rojects</h1>
<h4 class="text-sub fw-light fs-5 mb-5">go on, take a look</h4>
    
<div class="container mb-5">
    @for (project of projects; track $index) {
        <div class="row mb-4">
            <div class="col-md-4 col-sm-12 mb-4 d-flex justify-content-center">
                <img [src]="project.thumbnail" [alt]="project.title" class="img-fit background-main rounded-4" >
            </div>
            <div class="col-md-8 col-sm-12">
                <p class="text-main mb-0 d-flex justify-content-between align-items-center"><a class="fs-3 text-decoration-none text-main" [href]="project.link" target="_blank">{{project.title}}</a> <span class="fs-5">{{project.status}}</span></p>
                @for (lang of project.languages; track $index) {
                    <p class="badge mx-1 {{lang.color}}">
                        @if (lang.link == "") {
                            <span class="text-main">{{lang.title}}</span>
                        }@else {
                            <a class="text-decoration-none text-main" [href]="lang.link">{{lang.title}}</a>
                        }
                    </p>
                }
                <p class="text-sub fs-5">{{project.description}}</p>
                <div class="row fs-5">
                    <p class="text-main">
                        {{project.date}}
                    </p>
                </div>
            </div>
        </div>
    }
</div>

<footer class="fixed-bottom p-2 background-black d-flex justify-content-center">
    <a class="fs-3 text-decoration-none text-option" href=".">⚝&nbsp;&nbsp;Back</a>
</footer>
